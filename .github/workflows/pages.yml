name: GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Git ref to build and deploy (branch, tag, or SHA). Defaults to main."
        required: false
        default: "main"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash -l {0}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git-ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.68.1
          cache: true
          environments: dist

      - name: Build web app
        run: pixi run dist

      - name: Prepare site
        run: |
          mkdir _site
          cp dist/rpgpawns.html _site/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
