name: Wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions:
  pull-requests: write

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch full git history for hatch-vcs
          fetch-tags: true # Fetch tags for hatch-vcs

      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.68.1
          cache: true
          environments: dist

      - name: Build sdist and wheels
        run: pixi run dist

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Smoke test
        working-directory: /tmp
        run: |
          cp ${{ github.workspace }}/smoke_test.py .
          python smoke_test.py

      - name: Smoke test CLI
        working-directory: /tmp
        run: rpgpawns --help

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload web app
        id: upload-web
        uses: actions/upload-artifact@v7
        with:
          name: rpgpawns-html
          path: dist/rpgpawns.html
          if-no-files-found: error

      - name: Comment PR with web app link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**[Open rpgpawns.html](${{ steps.upload-web.outputs.artifact-url }})**',
            });
